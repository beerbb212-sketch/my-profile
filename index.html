<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วงเหล้าสายลุย - Random Drinking Game 🍻</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 35px 20px 25px 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
        }

        .subtitle {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 25px;
        }

        /* กล่องแสดงบทลงโทษ */
        .result-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #ff4757;
            border-radius: 16px;
            padding: 25px 15px;
            margin-bottom: 25px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.5;
            transition: transform 0.1s ease-in-out;
        }

        .shake {
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(-1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* จัดแถวปุ่มสุ่ม + จุดลับซ้ายขวา */
        .btn-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* ปุ่มสุ่มหลัก */
        .spin-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            width: 70%;
        }

        .spin-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.6);
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        /* จุดลับเม็ดถั่ว (ซ้ายและขวา) */
        .secret-bean-btn {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .secret-bean-btn:hover {
            background-color: rgba(255, 204, 0, 0.8);
            transform: scale(1.4);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🍻 เกมสุ่มวงเหล้าสายลุย</h1>
        <p class="subtitle">กดสุ่มคำสั่ง แล้วทำตามบทลงโทษทันที!</p>

        <!-- กล่องแสดงคำสั่ง -->
        <div class="result-box" id="result-box">
            กดปุ่มด้านล่างเพื่อเริ่มสุ่ม! 👇
        </div>

        <!-- แผงปุ่ม: จุดซ้าย (คนซ้ายกิน) + ปุ่มสุ่มหลัก + จุดขวา (ตัวตายตัวแทน) -->
        <div class="btn-wrapper">
            <div class="secret-bean-btn" onclick="triggerLeftDrink()" title=""></div>
            <button class="spin-btn" onclick="spinGame()">สุ่มคำสั่ง 🎲</button>
            <div class="secret-bean-btn" onclick="triggerVictim()" title=""></div>
        </div>
    </div>

    <script>
        // รายชื่อคำสั่งหลัก 8 รายการ
        const drinkingRules = [
            "🍺 ซ้ายมือกิน!",
            "🍻 ขวามือกิน!",
            "💀 หมดแก้วทันที ไม่ต้องพูดเยอะ!",
            "😴 รอดตัวไป พัก 1 รอบ",
            "👑 หาตัวตายตัวแทน",
            "🤝 ชนแก้วกับคนซ้ายมือ",
            "🤝 ชนแก้วกับคนขวามือ",
            "🕶️ ตรงข้ามกิน"
        ];

        // ฟังก์ชันสุ่มเกมปกติ
        function spinGame() {
            const resultBox = document.getElementById('result-box');
            resultBox.classList.add('shake');
            resultBox.style.color = "#ff4757";
            resultBox.innerText = "กำลังสุ่ม... 🎲";

            setTimeout(() => {
                resultBox.classList.remove('shake');
                const randomIndex = Math.floor(Math.random() * drinkingRules.length);
                resultBox.style.color = "#ffffff";
                resultBox.innerText = drinkingRules[randomIndex];
            }, 600);
        }

        // ฟังก์ชันแอบกดจุดซ้าย ออก "🍺 ซ้ายมือกิน!"
        function triggerLeftDrink() {
            const resultBox = document.getElementById('result-box');
            resultBox.classList.add('shake');
            resultBox.style.color = "#ffcc00";
            
            setTimeout(() => {
                resultBox.classList.remove('shake');
                resultBox.style.color = "#ffffff";
                resultBox.innerText = "🍺 ซ้ายมือกิน!";
            }, 300);
        }

        // ฟังก์ชันแอบกดจุดขวา ออก "👑 หาตัวตายตัวแทน"
        function triggerVictim() {
            const resultBox = document.getElementById('result-box');
            resultBox.classList.add('shake');
            resultBox.style.color = "#ffcc00";
            
            setTimeout(() => {
                resultBox.classList.remove('shake');
                resultBox.style.color = "#ffffff";
                resultBox.innerText = "👑 หาตัวตายตัวแทน";
            }, 300);
        }
    </script>

</body>
</html>
